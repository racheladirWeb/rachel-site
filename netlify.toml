[build]
  command = "node build.mjs"
  publish = "dist"

# עד שיהיה דומיין: האתר ב-Netlify לא נכנס לגוגל (PREVIEW), אבל הטופס פעיל.
# כשיהיה דומיין – למחוק את PREVIEW ולהוסיף SITE_URL = "https://הדומיין"
[build.environment]
  NODE_VERSION = "22"
  PREVIEW = "1"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
