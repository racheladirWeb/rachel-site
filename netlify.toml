[build]
  command = "node build.mjs"
  publish = "dist"

# האתר הסופי: adirlaw.co.il (משמש ל-canonical, sitemap, robots ותמונת השיתוף)
[build.environment]
  NODE_VERSION = "22"
  SITE_URL = "https://adirlaw.co.il"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
